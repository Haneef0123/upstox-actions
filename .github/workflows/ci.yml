name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'features-base', 'claude/**']
  pull_request:
    branches: ['main', 'features-base']

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --run

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment configuration
        run: npm run validate-env
        env:
          # Provide minimal env vars for validation
          BITBUCKET_BASE_URL: https://bitbucket.example.com
          BITBUCKET_USERNAME: ci-user
          BITBUCKET_APP_PASSWORD: ci-password
          AI_PROVIDER: groq
          AI_API_KEY: ci-api-key
          SLACK_WEBHOOK_URL: https://hooks.slack.com/ci-webhook

      - name: Build application
        run: npm run build
        env:
          # Provide minimal env vars for build
          BITBUCKET_BASE_URL: https://bitbucket.example.com
          BITBUCKET_USERNAME: ci-user
          BITBUCKET_APP_PASSWORD: ci-password
          AI_PROVIDER: groq
          AI_API_KEY: ci-api-key
          SLACK_WEBHOOK_URL: https://hooks.slack.com/ci-webhook

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"
        continue-on-error: true
